name: Build customer preview
on:
  push:
    tags: ['v0.1.0.dev*']
  pull_request:
    paths:
      - '.github/workflows/preview-release.yml'
      - 'scripts/package_controller.py'
      - 'nomiarch/bootstrap/wizard.py'
      - 'docs/customer-guide.md'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check version and behavior
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os; from nomiarch import __version__; tag = os.environ["RELEASE_TAG"]; assert not tag.startswith("v") or tag == "v" + __version__'
          python3 -m unittest discover -s tests -v
          python3 -m nomiarch dev demo
      - name: Build signed preview bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          python3 scripts/fetch_model.py .nomiarch/model.gguf
          python3 -m nomiarch bundle keygen --private .nomiarch/keys/private.pem --public .nomiarch/keys/public.pem
          python3 -m nomiarch bundle prepare --arch "$ARCH" --model .nomiarch/model.gguf --model-sha256 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db --signing-key .nomiarch/keys/private.pem --output .nomiarch/release.tar
          python3 -m nomiarch bundle verify --bundle .nomiarch/release.tar --trusted-key .nomiarch/keys/public.pem
      - name: Verify guest installation, repair, upgrade and encrypted recovery
        run: |
          sudo python3 -m nomiarch host install --bundle "$GITHUB_WORKSPACE/.nomiarch/release.tar" --trusted-key "$GITHUB_WORKSPACE/.nomiarch/keys/public.pem"
          sudo python3 -m nomiarch host repair --bundle "$GITHUB_WORKSPACE/.nomiarch/release.tar" --trusted-key "$GITHUB_WORKSPACE/.nomiarch/keys/public.pem"
          sudo python3 scripts/guest_recovery_test.py
      - name: Assemble customer downloads
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cp .nomiarch/release.tar "dist/nomiarch-$ARCH.tar"
          cp .nomiarch/keys/public.pem "dist/nomiarch-$ARCH-public.pem"
          python3 scripts/package_controller.py "dist/nomiarch-controller-$ARCH.zip"
          cp docs/customer-guide.md "dist/READ-ME-$ARCH.md"
          cd dist
          sha256sum * > "SHA256SUMS-$ARCH.txt"
          cat "SHA256SUMS-$ARCH.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview keys are generated for this build and discarded. Independently approve the public key fingerprint before offline admission.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.arch }}
          path: dist/
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: dist
      - name: Publish prerelease after both architecture gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          Engineering preview: terminal installation and maintenance wizard, bundled local inference, policy enforcement and audit evidence.

          Download the controller ZIP, bundle TAR, public PEM and SHA256SUMS for your architecture. Read the included READ-ME before running. Ubuntu 24.04 guest installation, repair, upgrade and encrypted payload recovery are gated on both architectures. Actual Multipass host combinations, physical air-gap installation and Azure provisioning remain unqualified.

          Keys are generated separately for each preview build; obtain approval of the public PEM SHA-256 through your trusted channel before offline use. The private signing keys are not published. This is not a production signing service or a stable release.
          EOF
          gh release create "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --prerelease --verify-tag --title "Nomiarch $RELEASE_TAG — customer preview" --notes-file notes.md
