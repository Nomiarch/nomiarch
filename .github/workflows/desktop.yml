name: Desktop wizard
on:
  pull_request:
    paths: ['nomiarch/**', 'desktop/**', 'tests/test_desktop.py', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['nomiarch/desktop/**', 'desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: macos-15-intel
            name: macos-intel
          - os: macos-14
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk age
      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Native controller tests
        run: python -m unittest discover -s tests -p test_desktop.py -v
      - name: Package native desktop app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NomiarchSetup --paths . --add-data packages:packages --add-data infra:infra desktop/launcher.py
      - name: Test packaged Windows screens
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'desktop-test.txt'
          Start-Process -FilePath '.\dist\NomiarchSetup.exe' -ArgumentList @('--self-test', $result) -Wait
          if (!(Test-Path $result)) { throw 'Packaged desktop screen test failed' }
          Get-Content $result
      - name: Test packaged macOS screens
        if: runner.os == 'macOS'
        run: dist/NomiarchSetup.app/Contents/MacOS/NomiarchSetup --self-test desktop-test.txt && cat desktop-test.txt
      - name: Test packaged Linux screens
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/NomiarchSetup --self-test desktop-test.txt && cat desktop-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: screen-${{ matrix.name }}
          path: desktop-test.png
      - name: Assemble downloads
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir downloads
          if [ "$RUNNER_OS" = 'Windows' ]; then
            cp dist/NomiarchSetup.exe downloads/NomiarchSetup-windows-x64.exe
          elif [ "$RUNNER_OS" = 'macOS' ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/NomiarchSetup.app "downloads/NomiarchSetup-$PLATFORM.zip"
          else
            cp dist/NomiarchSetup downloads/NomiarchSetup-linux-x64
          fi
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path('downloads')
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in root.iterdir()]
          (root/('SHA256SUMS-'+os.environ['PLATFORM']+'.txt')).write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: downloads/
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > notes.md <<'EOF'
          Graphical Nomiarch Setup 0.1.0.dev3. Installs the validated Core 0.1.0.dev2.

          Download the app for your computer and open it. No Python, Git, Docker or OpenSSL installation is needed for the desktop app. Choose Set up this computer or Download an offline kit. File downloads and signatures are checked automatically. VM support setup may request administrator approval and a restart.

          Windows preview: Windows 11 Pro/Enterprise/Education on Intel/AMD with Hyper-V. Windows Home and ARM Windows are not supported. Windows, macOS and Linux packages passed native controller and packaged-screen tests. End-to-end VM creation on customer desktops and physical air-gap testing remain unqualified.

          These are unsigned evaluation packages; Windows/macOS may warn or block them. No signing/notarization certificate has been provisioned. Do not disable operating-system protections. Use an approved evaluation environment if your organization permits unsigned software.
          EOF
          gh release create desktop-v0.1.0.dev3 downloads/* --target "$COMMIT" --prerelease --title 'Nomiarch Desktop Setup 0.1.0.dev3' --notes-file notes.md
