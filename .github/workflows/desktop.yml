name: Desktop wizard
on:
  pull_request:
    paths: ['nomiarch/**', 'desktop/**', 'tests/test_desktop.py', 'tests/test_foundation.py', 'tests/test_internal_repository.py', 'tests/fixtures/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['nomiarch/desktop/**', 'nomiarch/foundation/**', 'desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    outputs:
      release_ready: ${{ steps.release.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows-x64
          - os: macos-15-intel
            name: macos-intel
          - os: macos-14
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk age
      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements.txt -r desktop/cloud-requirements.txt
      - name: Native controller tests
        run: |
          python -m unittest discover -s tests -p test_desktop.py -v
          python -m unittest discover -s tests -p test_foundation.py -v
          python -m unittest discover -s tests -p test_internal_repository.py -v
      - name: Package Microsoft Azure sign-in helper
        run: python -m PyInstaller --noconfirm --clean --onedir --console --name az --distpath cloud-tools --collect-all azure.cli.core --collect-all azure.cli.command_modules.util --collect-all azure.cli.command_modules.lab --collect-all azure.cli.command_modules.profile --collect-all azure.cli.command_modules.vm --collect-all azure.cli.command_modules.network --collect-all azure.cli.command_modules.privatedns --collect-all azure.cli.command_modules.resource --collect-submodules azure.mgmt.compute --collect-submodules azure.mgmt.resource --collect-submodules azure.mgmt.core --collect-submodules azure.mgmt.authorization --collect-all msal --copy-metadata azure-cli --copy-metadata azure-cli-core --copy-metadata azure-cli-telemetry desktop/azure_helper.py
      - name: Verify packaged Microsoft helper
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then cloud-tools/az/az.exe version; else cloud-tools/az/az version; fi
      - id: release
        name: Read release admission gate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from nomiarch.desktop.catalog import RELEASE_READY, DESKTOP_VERSION
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+str(RELEASE_READY).lower()+'\n')
              f.write('version='+DESKTOP_VERSION+'\n')
          PY
      - name: Package native desktop app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NomiarchSetup --paths . --add-data packages:packages --add-data infra:infra --add-data cloud-tools:cloud-tools desktop/launcher.py
      - name: Test packaged Windows screens
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = Join-Path $PWD 'desktop-test.txt'
          Start-Process -FilePath '.\dist\NomiarchSetup.exe' -ArgumentList @('--self-test', $result) -Wait
          if (!(Test-Path $result)) { throw 'Packaged desktop screen test failed' }
          Get-Content $result
      - name: Test packaged macOS screens
        if: runner.os == 'macOS'
        run: dist/NomiarchSetup.app/Contents/MacOS/NomiarchSetup --self-test desktop-test.txt && cat desktop-test.txt
      - name: Test packaged Linux screens
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/NomiarchSetup --self-test desktop-test.txt && cat desktop-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: screen-${{ matrix.name }}
          path: desktop-test*.png
      - name: Assemble downloads
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir downloads
          if [ "$RUNNER_OS" = 'Windows' ]; then
            cp dist/NomiarchSetup.exe downloads/NomiarchSetup-windows-x64.exe
          elif [ "$RUNNER_OS" = 'macOS' ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/NomiarchSetup.app "downloads/NomiarchSetup-$PLATFORM.zip"
          else
            cp dist/NomiarchSetup downloads/NomiarchSetup-linux-x64
          fi
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path('downloads')
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in root.iterdir()]
          (root/('SHA256SUMS-'+os.environ['PLATFORM']+'.txt')).write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: downloads/
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release_ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          DESKTOP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          Graphical Nomiarch Setup with internal GitHub Enterprise Server approvals, explicit deployment-plan approval and a local/Azure destination choice. Installs the admitted Core 0.1.0.dev3.

          Download the app for your computer and open it. The official Microsoft Azure CLI sign-in helper is included. Local setup guides VM support installation and verifies offline files. Azure setup requires a customer subscription and an existing privately routed subnet. Azure uses a pinned Terraform/OpenTofu scaffold; local lifecycle uses the explicit Multipass adapter.

          Personal evaluation keeps a local approval record. Organisation setup supports public GitHub or an existing internal GitHub Enterprise Server. The internal connection uses verified HTTPS, an optional administrator-supplied public CA certificate, and private addresses only. Tokens stay in memory and are scoped to the selected repository. Both integrations require private repositories, designated human reviewers and protected main. Disconnected sites can use internal review for installation, repair, upgrade and removal. Other repository products remain export-only.

          Core evaluates observations and proposes bounded repairs through the controller; it has no infrastructure credentials or apply capability. Operations have their own exact plans and organisation PRs. Existing recipe 0.2.0 configurations remain supported; new configurations use recipe 0.3.0. Actual TLS and review protocol tests passed; customer GitHub Enterprise Server deployment qualification remains to be performed. See https://nomiarch.com/docs/running/ for the guide and exact preview limits.

          Windows preview: Windows 11 Pro/Enterprise/Education on Intel/AMD with Hyper-V. Windows Home and ARM Windows are not supported. Windows, macOS and Linux packages passed native controller and packaged-screen tests. End-to-end VM creation on customer desktops and physical air-gap testing remain unqualified.

          These are unsigned evaluation packages; Windows/macOS may warn or block them. No signing/notarization certificate has been provisioned. Do not disable operating-system protections. Use an approved evaluation environment if your organization permits unsigned software.
          EOF
          tag="desktop-v$DESKTOP_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This immutable preview release already exists; no assets were replaced.'
            exit 0
          fi
          gh release create "$tag" downloads/* --target "$COMMIT" --prerelease --title "Nomiarch Desktop Setup $DESKTOP_VERSION" --notes-file notes.md
