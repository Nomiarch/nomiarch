name: Ubuntu guest integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guest.yml'
      - 'nomiarch/**'
      - 'packages/**'
      - 'policies/tools.rego'
permissions:
  contents: read
jobs:
  offline-bundle-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare admitted model and temporary release key
        run: |
          python3 scripts/fetch_model.py .nomiarch/model.gguf
          python3 -m nomiarch bundle keygen --private .nomiarch/keys/private.pem --public .nomiarch/keys/public.pem
      - name: Build signed amd64 release from connected staging
        run: |
          python3 -m nomiarch bundle prepare --arch amd64 --model .nomiarch/model.gguf --model-sha256 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db --signing-key .nomiarch/keys/private.pem --output .nomiarch/release.tar
      - name: Install and verify on the disposable Ubuntu runner
        run: |
          sudo python3 -m nomiarch host install --bundle "$GITHUB_WORKSPACE/.nomiarch/release.tar" --trusted-key "$GITHUB_WORKSPACE/.nomiarch/keys/public.pem"
      - name: Verify repair of the same signed release
        run: |
          sudo python3 -m nomiarch host repair --bundle "$GITHUB_WORKSPACE/.nomiarch/release.tar" --trusted-key "$GITHUB_WORKSPACE/.nomiarch/keys/public.pem"
      - name: Upgrade and encrypted appliance recovery drill
        run: sudo python3 scripts/guest_recovery_test.py
      - name: Diagnostics
        if: failure()
        run: |
          sudo journalctl -u k3s --no-pager -n 80 || true
          sudo k3s kubectl -n nomiarch get pods -o wide || true
          sudo k3s kubectl -n nomiarch get events --sort-by=.lastTimestamp || true
          sudo k3s kubectl -n nomiarch logs deployment/broker --all-containers --tail=60 || true
          sudo k3s kubectl -n nomiarch logs deployment/model --tail=60 || true
          sudo k3s kubectl -n kube-system logs deployment/coredns --tail=60 || true
