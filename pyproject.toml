[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nomiarch"
version = "0.1.0.dev1"
description = "Portable private AI and infrastructure bootstrap"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nomiarch = "nomiarch.cli:main"

[tool.setuptools.packages.find]
include = ["nomiarch*"]
